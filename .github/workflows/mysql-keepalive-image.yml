name: Build mysql-keepalive image

on:
  push:
    branches: [main]
    paths:
      - 'docker/mysql-keepalive/**'
      - '.github/workflows/mysql-keepalive-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: firebase-cloud-491613
  REGION: europe-west2
  REPO: firebase-cloud
  IMAGE: mysql-keepalive

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.INFRA_WIF_PROVIDER }}
          service_account: ${{ secrets.INFRA_GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push
        working-directory: docker/mysql-keepalive
        run: |
          IMG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}"
          docker build -t "${IMG}:latest" -t "${IMG}:${{ github.sha }}" .
          docker push "${IMG}:latest"
          docker push "${IMG}:${{ github.sha }}"